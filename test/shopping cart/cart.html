<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <script src="authentication.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            overflow: hidden;
        }

        header {
            width: 100%;
            height: 10%;
            display: flex;
            align-items: center;
            box-shadow: rgba(0, 0, 0, 0.45) 0px 25px 20px -20px;
            justify-content: space-between;
        }

        h1 {
            margin-left: 20px;
        }

        header>.category-links {
            display: flex;
            gap: 30px;
            margin-right: 20px;
        }

        header>.category-links>a {
            text-decoration: none;
            color: black;
        }

        header>.category-links>a:hover {
            text-decoration: underline;
        }

        .products-container {
            margin-top: 10px;
            height: 72%;
            width: 97%;
            background-color: #f2f3f2;
            border-radius: 10px;
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            padding: 10px;
            overflow-y: auto;
        }

        .new-product {
            width: 200px;
            height: 300px;
            border: 1px solid gray;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            border-radius: 10px;
            flex-basis: 17%;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.2);
        }

        .imgcont {
            border-radius: 5px;
            height: 200px;
            width: 200px;
            overflow: hidden;
        }

        .imgcont img {
            object-fit: cover;
            height: 100%;
            width: 100%;
            border-radius: 5px;
        }

        .product-name {
            font-size: 14px;
            color: gray;
            margin-bottom: 5px;
        }

        .quantity {
            width: 60px;
            margin: 5px;
        }

        .total-price-container {
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header>
        <h1>Cart</h1>
        <div class="category-links">
            <a href="user.html">Home</a>
            <a href="statue.html">Decorative Sculptures</a>
            <a href="plants.html">Indoor Plants</a>
            <a href="lamps.html">Table Lamps</a>
            <a href="wall.html">Wall Hangings</a>
        </div>
    </header>
    <div class="products-container"></div>
    <p class="total-price-container">Total Price: ₹0.00</p>

    <script>
        async function loadCart() {
            //selecting the elements
            const productsContainer = document.querySelector(".products-container");
            const totalPriceContainer = document.querySelector(".total-price-container");

            //storing logged in user id
            const loggedInUserId = localStorage.getItem("loggedInUser");



            //Initial Load********************************************************************************************************************
            try {
                //fething user and products data in the DB
                const userResponse = await fetch(`http://localhost:3000/users/${loggedInUserId}`);
                const productsResponse = await fetch("http://localhost:3000/products");


                if (!userResponse.ok || !productsResponse.ok) throw new Error("Failed to fetch data.");

                // converting into json
                const user = await userResponse.json();
                const products = await productsResponse.json();


                if (user.cart.length === 0) {
                    productsContainer.innerHTML = "<p>Your cart is empty.</p>";
                    totalPriceContainer.textContent = "Total Price: ₹0.00";
                    return;
                }

                let updatedCart = [];
                let totalPrice = 0;
                let removedItems = false;

                productsContainer.innerHTML = "";



                user.cart.map(cartItem => { // products db items
                    const product = products.find(p => String(p.id) === String(cartItem.productId));



                    if (product) {
                        const quantity = parseInt(cartItem.quantity) || 1;
                        const itemTotal = quantity * parseFloat(product.productPrice);
                        totalPrice += itemTotal;

                        const productDiv = document.createElement("div");
                        productDiv.classList.add("new-product");

                        productDiv.innerHTML = `
                              <div class="imgcont"><img src="${product.productImage}" alt="${product.productName}"></div>
                              <p class="product-name">${product.productName}</p>
                              <p class="product-price">₹${product.productPrice}</p>
                              <input type="number" class="quantity" min="1" value="${quantity}" data-id="${product.id}" data-price="${product.productPrice}">
                              <button class="remove-btn" data-id="${product.id}">Remove</button>`;
                        productsContainer.appendChild(productDiv);

                        // Suppose product price or name was updated in the main product DB.The cart might have old info so again update the cart using fresh product info from products.
                        updatedCart.push({
                            productId: product.id,
                            quantity: quantity,
                            productName: product.productName,
                            productPrice: product.productPrice,
                            productImage: product.productImage
                        });

                    } else {
                        removedItems = true;
                        console.log(`Product ID ${cartItem.productId} no longer exists.`);
                    }
                });

                totalPriceContainer.textContent = `Total Price: ₹${totalPrice.toFixed(2)}`;

                
                await fetch(`http://localhost:3000/users/${loggedInUserId}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ cart: updatedCart })
                });

                if (removedItems) { // if true
                    alert("Some items were removed from your cart because they're no longer available.");
                }

            } catch (error) {
                console.error("Cart Load Error:", error);
                alert(error.message);
            }
        }





        //Updating cart Quantity *************************************************************************************************************
        async function updateCartQuantity(productId, newQuantity) {
            const loggedInUserId = localStorage.getItem("loggedInUser");

            try {
                const userResponse = await fetch(`http://localhost:3000/users/${loggedInUserId}`);
                const user = await userResponse.json();

                const updatedCart = user.cart.map(item =>
                    String(item.productId) === String(productId)
                        ? { ...item, quantity: newQuantity }
                        : item
                );

                await fetch(`http://localhost:3000/users/${loggedInUserId}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ cart: updatedCart })
                });

                loadCart(); // <-- Refresh UI
            } catch (error) {
                console.error("Update Quantity Error:", error);
            }
        }

        //Remove button ************************************************************************************************************************
        async function removeFromCart(productId) {
            const loggedInUserId = localStorage.getItem("loggedInUser");


            try {
                const userResponse = await fetch(`http://localhost:3000/users/${loggedInUserId}`);
                const user = await userResponse.json();

                const updatedCart = user.cart.filter(item => String(item.productId) !== String(productId));

                await fetch(`http://localhost:3000/users/${loggedInUserId}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ cart: updatedCart })
                });

                loadCart(); //UI refresh
            } catch (error) {
                console.error("Remove Error:", error);
            }
        }


        //Calculating Total Price************************************************************************************************************
        function updateTotalPriceUI() {
            let total = 0;
            document.querySelectorAll(".quantity").forEach(input => {
                const price = parseFloat(input.dataset.price);
                const quantity = parseInt(input.value) || 1;
                total += price * quantity;
            });
            document.querySelector(".total-price-container").textContent = `Total Price: ₹${total.toFixed(2)}`;
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadCart();


            //User Input modifies = quantity and price get changed*****************************************************************************
            document.querySelector(".products-container").addEventListener("input", (event) => {
                console.log(event.target);
                
                // console.log("Using this :",this.dataset.id)
                const productId = event.target.dataset.id;
                const quantity = parseInt(event.target.value) || 1;
                updateCartQuantity(productId, quantity);
                updateTotalPriceUI();
               
            });

            //Remove Button *****************************************************************************************************
            document.querySelector(".products-container").addEventListener("click", (event) => {
                
                    const productId = event.target.dataset.id;
                    // console.log("using this",this.target.dataset.id);
                    console.log(event.target.dataset.id)
                    removeFromCart(productId);
               
            });
        });
    </script>
</body>

</html>

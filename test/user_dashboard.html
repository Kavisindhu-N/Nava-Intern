<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IKEA</title>
    <link rel="icon" href="img/logo2.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap" rel="stylesheet">
    




    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            overflow-x: hidden;
            /* Hide horizontal scroll */
            width: 100%;
            font-family: "Montserrat", sans-serif;

        }

        .img_sliding_container {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .slider-track {
            display: flex;
            width: 500vw;
            transition: transform 0.5s ease-in-out;
        }

        .slider-track>img {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        header>nav>div {
            display: flex;
            align-items: center;
            gap: 10px;

        }

        header>nav {
            display: flex;
            align-items: center;
            justify-content: space-between;


            img {
                height: 30px;
                width: 30px;
                margin-left: 10px;
                border-radius: 10px;
            }

        }

        header>nav>ul {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 60px;
            padding: 10px;
            list-style: none;

            a {
                text-decoration: none;
                color: white;
            }

            li {
                cursor: pointer;
            }

            button {
                padding: 10px;
                width: 100px;

            }

        }

        header {
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
        }

        main {
            position: absolute;
            top: 0%;
            z-index: -1;
        }

        .items {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 50px;
            margin-top: 650px;
            max-width: 100vw;

            .items-name>div {
                height: 170px;
                width: 170px;
                border-radius: 10px;
                box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.5);
            }
        }

        .items>.items-name>div {
            overflow: hidden;

            img {
                height: 100%;
                width: 100%;
                object-fit: cover;
            }
        }

        .items>.items-name>p {
            text-align: center;
            margin-top: 20px;
        }

        .items>.items-name>div:hover {
            transform: scale(1.1);
        }

        /* footer {
            background-color: black;
        } */
    </style>

</head>



<body>

    <header>
        <nav>
            <div>
                <img src="img/logo2.jpg" alt="">
                <h3>IKEA</h3>
            </div>

            <ul>
                <a href="cart.html" target="_blank">
                    <li>Go To Cart</li>
                </a>
                <a href="">
                    <li>About</li>
                </a>
                <li><button>Log out</button></li>
            </ul>

        </nav>
    </header>



    <main>
        <div class="img_sliding_container">
            <div class="slider-track" id="slideTrack">
                <img src="img/slide1.png" alt="image">
                <img src="img/slide2.png" alt="image">
                <img src="img/slide3.jpg" alt="image">
                <img src="img/slide4.jpg" alt="image">
                <img src="img/slide5.jpg" alt="image">
            </div>
        </div>
    </main>




    <div class="items" id="items">
        <div class="items-name">
            <div>
                <a href="statue.html" target="_blank"><img src="img/items-statue.jpg" alt=""></a>
            </div>
            <p>Decorative Sculptures</p>
        </div>


        <div class="items-name">
            <div>
                <a href="plants.html" target="_blank"><img src="img/items-plant.jpg" alt=""></a>
            </div>
            <p>Indoor Plants</p>
        </div>


        <div class="items-name">
            <div>
                <a href="lamps.html" target="_blank"><img src="img/items-light.jpg" alt=""></a>
            </div>
            <p>Table Lamps</p>
        </div>


        <div class="items-name">
            <div>
                <a href="wall.html" target="_blank"><img src="img/items-wall.jpg" alt=""></a>
            </div>
            <p>Wall Hangings</p>
        </div>

    </div>

    <footer>

    </footer>


    <script>

        // AUTO SCROLLING

        const slideTrack = document.getElementById("slideTrack");
        let index = 0;
        const totalImages = document.querySelectorAll(".slider-track img").length;

        setInterval(() => {
            index = (index + 1) % totalImages; // Loop back to first image
            slideTrack.style.transform = `translateX(-${index * 100}vw)`;
        }, 3000); // Change image every 2 seconds


    </script>

</body>

</html>

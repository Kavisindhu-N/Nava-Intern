<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        header {
            width: 100%;
            height: 10%;
            display: flex;
            align-items: center;
        }

        .products-container {
            margin-top: 10px;
            height: 82%;
            width: 97%;
            background-color: #f2f3f2;
            border-radius: 10px;
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            padding: 10px;
            overflow-y: auto;
        }

        .new-product {
            width: 200px;
            height: 250px;
            border: 1px solid gray;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            border-radius: 10px;
            flex-basis: 17%;
            box-shadow: 10px 10px 20px rgba(0, 0, 0, 0.5);
        }

        .imgcont {
            border-radius: 5px;
            height: 250px;
            width: 200px;
            overflow: hidden;
        }

        .imgcont img {
            object-fit: cover;
            height: 100%;
            width: 100%;
            border-radius: 5px;
        }

        .product-name {
            font-size: 13px;
            color: gray;
            margin-bottom: 5px;
        }

        .new-product button {
            background-color: #00004C;
            color: white;
            border: none;
            border-radius: 5px;
            width: 100%;
            padding: 10px;
            cursor: pointer;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Cart</h1>
    </header>
    <div class="products-container"></div>

    <script>
        const productsContainer = document.querySelector(".products-container");

        async function loadCart() {
            
                const cartResponse = await fetch("http://localhost:3000/cart");
                let cartItems = await cartResponse.json();
                console.log("Cart Items:", cartItems);

                const productsResponse = await fetch("http://localhost:3000/products");
                const products = await productsResponse.json();
                console.log("Products:", products);

                productsContainer.innerHTML = "";

                cartItems = cartItems.filter(cartItem =>
                    products.some(p => String(p.id) === String(cartItem.productId))
                );

                if (cartItems.length === 0) {
                    productsContainer.innerHTML = "<p>Your cart is empty.</p>";
                    return;
                }

                cartItems.forEach(cartItem => {
                    const product = products.find(p => p.id === cartItem.productId);
                    if (product) {
                        const productDiv = document.createElement("div");
                        productDiv.classList.add("new-product");

                        productDiv.innerHTML = `
                            <div class="imgcont"><img src="${product.productImage}" alt="${product.productName}"></div>
                            <p class="product-name">${product.productName}</p>
                            <p class="product-price">₹${product.productPrice}</p>
                            <button class="remove-btn" data-id="${cartItem.id}">Remove</button>
                        `;
                        productsContainer.appendChild(productDiv);
                    }
                });

                document.querySelectorAll(".remove-btn").forEach(button => {
                    button.addEventListener("click", async function () {
                        const itemId = this.getAttribute("data-id");
                        await removeFromCart(itemId);
                    });
                });
            
        }

        async function removeFromCart(itemId) {
            
                const response = await fetch(`http://localhost:3000/cart/${itemId}`, {
                    method: "DELETE",
                });
                
                alert("Item Removed Successfully");
                loadCart();
            
        }

        // setInterval(loadCart, 5000);
        loadCart();
    </script>
</body>

</html>
